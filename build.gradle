plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"versormotion" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// The pure-math core lives in the versor-java submodule.
sourceSets {
	main {
		java.srcDir 'lib/versor-java/src/main/java'
		java.srcDir 'lib/versor-java/src/blaze3d/java'
	}
	test {
		java.srcDir 'lib/versor-java/src/test/java'
	}
}

repositories {
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content { includeGroup 'maven.modrinth' }
	}
	maven {
		name = 'Shedaniel'
		url = 'https://maven.shedaniel.me/'
	}
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Client configuration screen and its Mod Menu integration.
	implementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	runtimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	// Shader pipeline for local visual testing (Iris needs its pinned Sodium build).
	runtimeOnly "maven.modrinth:iris:1.11.7+26.3-fabric"
	runtimeOnly "maven.modrinth:sodium:mc26.3-0.9.2-fabric"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Headless CI has no xvfb-run; the dev client runs on the local display.
// Forward console input so commands can be tested from a script.
tasks.named('runServer') {
	standardInput = System.in
}

tasks.named('runClient') {
	useXvfb.set(false)
}

tasks.named('test') {
	failOnNoDiscoveredTests = false
}

tasks.register('gaTest', JavaExec) {
	group = 'verification'
	description = 'Runs the standalone geometric algebra checks (vsr.GaTest).'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'vsr.GaTest'
}

tasks.register('weTest', JavaExec) {
	group = 'verification'
	description = 'Runs the WorldEdit-style selection, shape, clipboard and undo checks (WeChecks).'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.gblmx.versormotion.wedit.WeChecks'
}

tasks.register('combatTest', JavaExec) {
	group = 'verification'
	description = 'Runs the swing, guard-plane, field-bake and tornado checks (CombatChecks).'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.gblmx.versormotion.combat.CombatChecks'
}
