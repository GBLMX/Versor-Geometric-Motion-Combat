name: Bug report
description: Report a crash, visual regression, or incorrect gameplay behavior.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For security issues, use the private advisory flow in SECURITY.md instead.
  - type: input
    id: mod-version
    attributes:
      label: Mod version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Minecraft, Fabric Loader, Fabric API, Java, and other relevant mods.
      placeholder: "Minecraft 26.3, Loader 0.19.5, Fabric API 0.163.0, Java 25"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or crash report
      description: Paste the relevant excerpt or attach the file.
      render: text
  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: Include combat.json or client config changes if applicable.
      render: json
